<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>City Info</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Custom font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!--Custom css-->
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid px-5">

        <header class="my-5">
            <h1 class="text-center">city info</h1>
            <div class="my-5">
                <form id="inputForm" class="input-group">
                    <input class="form-control" id="input" placeholder="Enter a city name" maxlength="50" required>
                    <button class="btn btn-outline-primary" type="submit" id="inputGroupFileAddon04"><svg
                            xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-search" viewBox="0 0 16 16">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                        </svg></button>
                </form>
            </div>
        </header>

        <main class="my-5" id="city-information">
            <!--Weather data will be populated dynamically here-->

            <!--Loading spinner with Bootstrap. Hidden by default. Showing when API calls begin and finally hidden when data is ready.-->
            <div class="text-center" id="card-spinner">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>

        </main>

        <footer class="mt-auto">
            <p class="text-center"><em>City information app by Antti Aalto</em></p>
        </footer>

    </div>

    <!--jQuery-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!--Axios-->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!--custom js-->
    <script src="scripts/main.js"></script>

</body>

</html>
